name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
env:
  BIN_NAME: dirdiff
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Check that the release tag is a valid Go module version
        if: github.event_name == 'release'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME is not a valid semver Go module version (vX.Y.Z)"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
  build:
    needs: check-version
    name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # static binaries also run as remote agents on musl or older glibc hosts.
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w -X main.version=$GITHUB_REF_NAME" -o "$BIN_NAME-$GOOS-$GOARCH$EXT"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BIN_NAME }}-*
          retention-days: 1
  build-musl:
    # fully static, so the binaries also run on musl systems such as Alpine
    needs: check-version
    name: Build for linux/${{ matrix.goarch }} (musl)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Build static binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X main.version=$GITHUB_REF_NAME" -o "$BIN_NAME-linux-musl-$GOARCH"
          if ! file "$BIN_NAME-linux-musl-$GOARCH" | grep -q "statically linked"; then
            echo "::error::$BIN_NAME-linux-musl-$GOARCH is not statically linked"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binary-linux-musl-${{ matrix.goarch }}
          path: ${{ env.BIN_NAME }}-*
          retention-days: 1
  release:
    name: Create GitHub Release
    needs: [build, build-musl]
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: cd dist && sha256sum dirdiff-* > SHA256SUMS
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
